name: Windows client release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained client
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') { $Matches[1] } else { '1.0.0' }
          dotnet publish windows-agent/RentDeviceAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false "-p:Version=$version" -o windows-agent/publish
      - name: Stamp release version in client settings
        shell: pwsh
        run: |
          $path = 'windows-agent/publish/appsettings.json'
          $settings = Get-Content $path -Raw | ConvertFrom-Json
          $settings.RentDeviceAgent.Version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') { $Matches[1] } else { '1.0.0' }
          $settings.RentDeviceAgent.GitHubReleaseAsset = 'RentDeviceAgent.exe'
          $settings | ConvertTo-Json -Depth 8 | Set-Content $path -Encoding UTF8
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: iscc windows-agent/installer.iss
      - name: Upload release installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            windows-agent/output/RentDeviceAgent-Setup.exe
            windows-agent/publish/RentDeviceAgent.exe
          generate_release_notes: true
