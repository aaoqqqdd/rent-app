name: Build Windows Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows executable
        run: dotnet publish windows-agent/RentDeviceAgent.csproj --configuration Release --runtime win-x64 --self-contained true --output windows-agent/publish -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: iscc installer.iss
        working-directory: windows-agent

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RentDeviceAgent-win-x64
          path: windows-agent/publish/RentDeviceAgent.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RentDeviceAgent-installer
          path: windows-agent/output/RentDeviceAgent-Setup.exe
